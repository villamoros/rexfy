services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rexfy
      POSTGRES_PASSWORD: rexfy
      POSTGRES_DB: rexfy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rexfy"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    profiles: ["full"]
    environment:
      REXFY_DATABASE_URL: postgresql+psycopg://rexfy:rexfy@postgres:5432/rexfy
      REXFY_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    profiles: ["full"]
    command: ["uv", "run", "--no-dev", "python", "-m", "app.worker"]
    environment:
      REXFY_DATABASE_URL: postgresql+psycopg://rexfy:rexfy@postgres:5432/rexfy
      REXFY_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
