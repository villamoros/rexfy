[project]
name = "rexfy-api"
version = "0.1.0"
description = "Rexfy backend API (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "boto3>=1.35",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.0",
    "vercel>=0.12.1",
]

[dependency-groups]
dev = [
    "mutmut>=3.4,<4",
    "pytest>=8",
    "pytest-cov>=7,<8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = [
    "app/domain/deals/pricing.py",
    "app/domain/deals/state_machine.py",
    "app/domain/logistics/state_machine.py",
    "app/domain/organizations/roles.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_pricing.py",
    "tests/test_state_machines.py",
    "tests/test_team.py",
]
mutate_only_covered_lines = true
