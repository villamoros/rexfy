name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rexfy
          POSTGRES_PASSWORD: rexfy
          POSTGRES_DB: rexfy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rexfy" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: uv run python -m app.cli.openapi openapi.json && git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run api:types && git diff --exit-code src/lib/api-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # The browser journey needs a Clerk development instance. It runs once the repository has
  # the E2E_CLERK_* secrets (Settings → Secrets → Actions); until then it is skipped.
  e2e:
    runs-on: ubuntu-latest
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      REXFY_CLERK_ISSUER: ${{ secrets.E2E_CLERK_ISSUER }}
      REXFY_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      REXFY_TASK_QUEUE: inline
      API_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rexfy
          POSTGRES_PASSWORD: rexfy
          POSTGRES_DB: rexfy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rexfy" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - id: enabled
        run: echo "run=${{ env.CLERK_SECRET_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.enabled.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.enabled.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.enabled.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start the API
        if: steps.enabled.outputs.run == 'true'
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build the web
        if: steps.enabled.outputs.run == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run the journey
        if: steps.enabled.outputs.run == 'true'
        working-directory: apps/web
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/api/api.log
