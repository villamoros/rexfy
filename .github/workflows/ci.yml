name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rexfy
          POSTGRES_PASSWORD: rexfy
          POSTGRES_DB: rexfy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rexfy" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - name: Migration graph and applied revision are safe
        run: uv run python -m app.cli.migrate check
      - name: API tests and branch coverage gate
        run: >-
          uv run pytest -q --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=60
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
      - name: OpenAPI schema is up to date
        run: uv run python -m app.cli.openapi openapi.json && git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run api:types && git diff --exit-code src/lib/api-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate SLO evaluator
        run: python -m unittest discover -s scripts -p 'test_*.py'

  public-smoke:
    runs-on: ubuntu-latest
    env:
      API_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      REXFY_DATABASE_URL: postgresql+psycopg://rexfy:rexfy@localhost:5432/rexfy
      REXFY_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rexfy
          POSTGRES_PASSWORD: rexfy
          POSTGRES_DB: rexfy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rexfy" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start the API
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build public web
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run mandatory public smoke
        working-directory: apps/web
        run: npm run e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/api/api.log

  e2e:
    runs-on: ubuntu-latest
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      REXFY_CLERK_ISSUER: ${{ secrets.E2E_CLERK_ISSUER }}
      REXFY_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      API_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rexfy
          POSTGRES_PASSWORD: rexfy
          POSTGRES_DB: rexfy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rexfy" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - name: Require E2E credentials
        run: |
          test -n "$CLERK_PUBLISHABLE_KEY"
          test -n "$CLERK_SECRET_KEY"
          test -n "$REXFY_CLERK_ISSUER"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start the API
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build the web
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run the journey
        working-directory: apps/web
        run: npx playwright test --project=commercial-desktop --project=commercial-mobile
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/api/api.log
