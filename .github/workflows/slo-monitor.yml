name: Production SLO monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  journey:
    runs-on: ubuntu-latest
    environment: production-observability
    env:
      WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      API_URL: ${{ vars.PRODUCTION_API_URL }}
      E2E_BASE_URL: ${{ vars.PRODUCTION_WEB_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require monitoring configuration
        run: |
          test -n "$WEB_URL" && test -n "$API_URL"
          test -n "$CLERK_PUBLISHABLE_KEY" && test -n "$CLERK_SECRET_KEY"
      - name: Probe web, API, database, Redis and outbox readiness
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 10 "$WEB_URL" -o /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 10 "$API_URL/health/ready" | tee readiness.json
          python -c "import json; assert json.load(open('readiness.json'))['status'] == 'ok'"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Run the commercial SLI
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=commercial-desktop
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slo-failure-${{ github.run_id }}
          path: |
            readiness.json
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 30
      - name: Alert platform owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg title "SLO monitor failed · run $GITHUB_RUN_ID" \
            --arg body "The production readiness or commercial journey check failed. Evidence: $RUN_URL" \
            '{title: $title, body: $body}' > issue.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues" \
            --data @issue.json
